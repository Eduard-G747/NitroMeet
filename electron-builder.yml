appId: com.eduar.nitromeet
productName: NitroMeet
copyright: Copyright (c) 2026 Eduard Georgescu. MIT License.
# electron-updater reads releases from this repo (the Release workflow attaches the installer there).
publish:
  provider: github
  owner: eduard-georgescu
  repo: nitromeet
directories:
  output: dist
files:
  - out/**
  - package.json
  - resources/**
asarUnpack:
  - resources/**
npmRebuild: false
# Hardening: the installed NitroMeet.exe can't be used as a generic Node.js runtime or have code
# injected through environment variables / debugger flags, and app.asar is integrity-checked.
electronFuses:
  runAsNode: false
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  enableCookieEncryption: true
  resetAdHocDarwinSignature: true
win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NitroMeet
  artifactName: ${productName}-Setup-${version}.${ext}
